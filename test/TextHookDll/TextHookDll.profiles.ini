; ============================================================================
;  TextHookDll.profiles.ini — 引擎适配表（S3：运行期外部化）
;
;  放在 TextHookDll-*.dll 同目录即会被自动加载（也可用
;  -exportarg "...|profilefile=<别的路径>" 指定）。
;
;  改这个文件不需要重新编译 DLL。DLL 每次被注入时读一次。
;
;  本文件默认**全部注释掉**，所以不改它时行为和以前完全一致
;  （用编译进 DLL 的 4 个内置 profile）。要用哪个就把对应段落的
;  「;」去掉。
;
;  ---------------------------------------------------------------------------
;  格式
;  ---------------------------------------------------------------------------
;    [profile 名]              段落头。名字必须是 ASCII，且不能重复。
;    codepage=932              *A 系列文本的代码页。0 = 用系统 ANSI 代码页。
;                              932=Shift-JIS  936=GBK  65001=UTF-8  1200=UTF-16
;    minlen=2                  短于此长度的文本丢弃（滤掉单字符噪声）
;    dedup=200                 去重窗口（毫秒）。同一文本在此窗口内只上报一次。
;    hook=<模块>,<函数>        挂钩目标，一个 profile 可以写多行。
;    hook=<模块>,<函数>,iat    第三段是挂钩方式，目前只有 iat 一种。
;    desc=说明文字              随便写，只给人看。
;
;  ---- 只对「框架不认识的函数」需要的键（见示例 5）----
;    text=1                    第几个参数是文本指针（序号 1 起）。写了它就走通用转发器。
;    len=2                     第几个参数是长度（序号 1 起）。不写 = 文本以 \0 结尾。
;    argc=4                    该函数的参数总数（1..8）。**必填**，转发调用要按它弹栈。
;    wide=0                    1 = 文本是 wchar_t*（UTF-16 直接上报）；0 = char*（按 codepage 转）
;    conv=stdcall              调用约定：stdcall（默认）或 cdecl
;
;  这 5 个键写在段内任意位置都行（整段读完才生效），会应用到该段的所有 hook=。
;
;    注释用 ; 或 # 开头。键值对必须写在某个 [段落] 之后。
;
;  ---------------------------------------------------------------------------
;  ⚠ 能力边界（重要，别被「写个文件就能适配引擎」误导）
;  ---------------------------------------------------------------------------
;  两条路，按引擎情况选：
;
;  1) 引擎走的是 GDI / user32 的这 6 个函数 —— 直接写 hook= 就行，
;     参数位置由编译进 DLL 的专用提取器负责：
;
;      gdi32.dll   TextOutA    TextOutW
;      gdi32.dll   ExtTextOutA ExtTextOutW
;      user32.dll  DrawTextA   DrawTextW
;
;  2) 引擎用的是**别的**函数 —— 也可以挂，但要自己说清楚参数位置
;     （见下面「示例 5」）：text= / len= / argc=，必要时再加 wide= / conv=。
;
;  仍然做不到的：
;    · 自动猜出「第几个参数是文本」（得自己看反汇编 / 头文件）
;    · 把逐字显示的片段拼成整句（交给消费端）
;    · DirectX 自绘的文本（不经任何 API，属路线图 S5）
;    · 引擎连 GetProcAddress 都自己现取的情况（属 S2 Inline Hook）
;
;  ---------------------------------------------------------------------------
;  内置的 4 个 profile（不写本文件时用的就是它们）
;  ---------------------------------------------------------------------------
;    generic-gdi        编码自动（系统 ANSI）  挂全部 6 个函数
;    generic-gdi-sjis   932                    挂全部 6 个函数
;    generic-gdi-gbk    936                    挂全部 6 个函数
;    generic-unicode    1200                   只挂 *W 系列 3 个
;
;  在下面写出同名的段落即可**覆盖**对应的内置 profile。
; ============================================================================


; ---------------------------------------------------------------------------
; 示例 1：只挂一两个函数，减少无关钩子
;   适合已确认引擎只用 TextOutA 的游戏。挂钩越少，开销和噪声越小。
; ---------------------------------------------------------------------------
; [only-textout-a]
; desc=只挂 TextOutA 的引擎
; codepage=932
; minlen=2
; dedup=200
; hook=gdi32.dll,TextOutA


; ---------------------------------------------------------------------------
; 示例 2：日文原版游戏，强制 Shift-JIS，去重窗口放宽
;   注意 profile 里的 codepage 只是默认值，命令行 cp= 会覆盖它。
; ---------------------------------------------------------------------------
; [my-game-jp]
; desc=某日文原版游戏
; codepage=932
; minlen=3
; dedup=400
; hook=gdi32.dll,TextOutA
; hook=gdi32.dll,ExtTextOutA
; hook=user32.dll,DrawTextA


; ---------------------------------------------------------------------------
; 示例 3：中文汉化版（GBK），只挂 A 系列
;   汉化版通常把引擎的文本输出改成了 *A + GBK。
; ---------------------------------------------------------------------------
; [my-game-cn]
; desc=某汉化版游戏
; codepage=936
; minlen=2
; dedup=300
; hook=gdi32.dll,TextOutA
; hook=gdi32.dll,ExtTextOutA


; ---------------------------------------------------------------------------
; 示例 4：覆盖内置兜底 profile
;   想改「不传 engine= 时」的行为就写 [generic-gdi]。
; ---------------------------------------------------------------------------
; [generic-gdi]
; codepage=932
; minlen=2
; dedup=250
; hook=gdi32.dll,TextOutA
; hook=gdi32.dll,TextOutW
; hook=gdi32.dll,ExtTextOutA
; hook=gdi32.dll,ExtTextOutW
; hook=user32.dll,DrawTextA
; hook=user32.dll,DrawTextW


; ---------------------------------------------------------------------------
; 示例 5：挂钩框架**不认识**的函数
;   引擎常把文本输出收拢进自己的函数，例如
;       void __stdcall RenderText(HDC dc, int x, int y, const char* s, int len);
;   这里 4 个参数分别是 dc / x / y / s？不对——上面那行有 5 个参数，
;   所以 argc=5、text=4、len=5。**位置必须自己数准**，数错了轻则抓不到，
;   重则把整数当指针去读（所以务必先在调试器里确认）。
;
;   wide=0 表示 char*（按 codepage 转），wide=1 表示 wchar_t*。
;   conv=stdcall 是 Win32 默认；若该函数声明为 __cdecl 必须写 cdecl，
;   否则转发调用会把栈弹歪、进程直接崩。
; ---------------------------------------------------------------------------
; [my-engine]
; desc=引擎私有的文本输出函数
; codepage=932
; minlen=2
; dedup=200
; text=4
; len=5
; argc=5
; wide=0
; conv=stdcall
; hook=myengine.dll,RenderText
