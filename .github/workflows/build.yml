name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-x86 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file
        run: dotnet publish DllInjector/DllInjector.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/${{ matrix.rid }}/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare dist
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/win-x64/DllInjector.exe dist/DllInjector-x64.exe
          cp artifacts/win-x86/DllInjector.exe dist/DllInjector-x86.exe
          ls -la dist

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 固定 body：更新时整体覆盖，避免 generate_release_notes 重复追加 "Full Changelog"
          body: |
            ## DLL 注入器 v1.0.0

            选择目标 exe 和 dll，以挂起方式启动目标程序，注入 DLL 后恢复运行。

            - DllInjector-x64.exe — 64 位版本（用于 64 位目标程序）
            - DllInjector-x86.exe — 32 位版本（用于 32 位目标程序）

            自包含单文件，无需安装 .NET 环境即可直接运行。使用方法见仓库 README。

            注入方式：CreateRemoteThread / NtCreateThreadEx / QueueUserAPC / 反射式注入（Reflective）。

