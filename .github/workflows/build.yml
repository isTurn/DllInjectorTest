name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # probe 是随仓库分发的探针 DLL，用于给发布出来的 exe 做冒烟测试。
          # 两个架构必须各配一个同架构的探针，否则 -checkdll 会因位数不符而失败。
          - rid: win-x64
            probe: test/TestHookDll/TestHookDll-x64.dll
          - rid: win-x86
            probe: test/TestHookDll/TestHookDll-x86.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # C# 侧的纯逻辑回归测试：PE 解析、DLL 分隔、-method 解析、进程名通配。
      # 放在 publish 之前跑，失败时能最快拿到结论（不必等发布产物）。
      # 这些函数「错了不会崩、但会静默给出错误结果」，正是最需要自动化兜底的地方。
      - name: Run C# logic tests
        shell: cmd
        run: test\DllInjectorTests\build.bat

      - name: Publish self-contained single-file
        run: dotnet publish DllInjector/DllInjector.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/${{ matrix.rid }}

      # 冒烟测试：确认发布出来的 exe 真的能跑、PE 体检结果正确。
      # 只依据退出码判定（-checkdll 成功返回 0、失败返回 1），不解析输出文本——
      # 输出含中文，在非中文 locale 的 runner 上编码不可靠。
      # 注意 -checkdll 带参数，因此不会触发 GUI 模式的 UAC 提权重启。
      #
      # 必须用 Start-Process -Wait，不能用 & 调用：DllInjector.exe 是 WinExe
      # （GUI 子系统，无控制台），PowerShell 的 & 对这类程序不会等待，
      # $LASTEXITCODE 会拿到空值（日志里表现为 "exit code: " 后面什么都没有），
      # 进而被误判成失败。Start-Process -Wait 会等进程真正退出再取 ExitCode。
      - name: Smoke-test published binary
        shell: pwsh
        run: |
          $exe = "out/${{ matrix.rid }}/DllInjector.exe"
          if (-not (Test-Path $exe)) { throw "not found: $exe" }
          $probe = "${{ matrix.probe }}"
          Write-Host "running: $exe -checkdll $probe"
          $p = Start-Process -FilePath $exe -ArgumentList '-checkdll', $probe `
                             -Wait -PassThru -NoNewWindow
          $rc = $p.ExitCode
          Write-Host "exit code: $rc"
          if ($rc -ne 0) { throw "-checkdll failed (exit $rc)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/${{ matrix.rid }}/
          if-no-files-found: error

  # 原生测试素材（C）的编译与功能验证。
  # 之前 CI 完全不碰 C 代码：/utf-8 缺失、导出名被 __stdcall 修饰、硬编码绝对路径
  # 这类问题都只能等本地构建时才发现。text-hook 的验证器会把
  # 「装钩子 → 捕获文本 → 卸载后 IAT 是否还原」整条链路跑一遍（x64 + x86）。
  native:
    name: Native tests (x64 + x86)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test material (injection targets)
        shell: cmd
        run: test\build_test.bat

      - name: Build and verify text-hook material
        shell: cmd
        run: test\TextHookDll\build.bat

      # TestHookDll 是「注入后调用导出函数」的样例 DLL，随仓库分发。
      # 它的 build.bat 会顺手编译 TestLoad.c 并真的调一遍导出函数（x64 + x86），
      # 所以导出名被 __stdcall 修饰这类问题会在这里当场暴露。
      - name: Build and verify call-export sample DLL
        shell: cmd
        run: test\TestHookDll\build.bat

      # 反射式注入素材。产物同样落在 test_output\（脚本默认不再写源码目录），
      # 所以与上面两步互不干扰。
      - name: Build reflective-injection material
        shell: cmd
        run: test\TestReflectiveDll\build.bat

      # shellcode 与 .asm 的同步检查：Program.cs 里的四个 byte[] 是手工从 .obj
      # 抄过去的历史遗留，现在由 gen_shellcode.py --apply 直接回填。
      # 这里重新汇编 + 回填，再用 git diff 断言「仓库里提交的数组确实等于
      # 当前 .asm 汇编出来的字节」。如果有人改了 .asm 却忘了重新生成，
      # 这一步会失败并把差异打出来。
      #
      # 两个 errorlevel 必须分开查：先查「脚本本身跑没跑成」，再查「跑成了但字节不一致」。
      # 只查 git diff 的话，脚本因为环境问题失败（没装 Python、汇编器报错）时
      # 仓库里的数组当然没变，git diff 反而通过，整个检查就静默失效了。
      - name: Verify shellcode arrays match the assembly sources
        shell: cmd
        run: |
          test\ManualMap\build_shellcode.bat
          if errorlevel 1 (
            echo SHELLCODE_BUILD_FAILED - test\ManualMap\build_shellcode.bat did not complete.
            exit /b 1
          )
          git diff --exit-code -- DllInjector\Program.cs
          if errorlevel 1 (
            echo SHELLCODE_OUT_OF_SYNC - run test\ManualMap\build_shellcode.bat locally and commit the result.
            exit /b 1
          )

      - name: Upload native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-output
          # The build scripts write every product (DLLs, log files, verifiers)
          # into test_output\, so that directory alone is enough. Listing the
          # source directories again would only ever find stale files left over
          # from older runs.
          path: test_output/
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, native ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # release job 跑在 ubuntu-latest 上，workspace 默认是空的：
      # 下面的 Prepare dist 要拷 test/ 下已提交的样例 DLL，Prepare release notes
      # 要读 CHANGELOG.md，都依赖工作区里有仓库内容，所以必须先 checkout。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare dist
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/win-x64/DllInjector.exe dist/DllInjector-x64.exe
          cp artifacts/win-x86/DllInjector.exe dist/DllInjector-x86.exe
          # 样例 DLL 直接取仓库里提交过的版本。native job 虽然也构建了它们，
          # 但那只是构建副产物；发布应当用可复现构建、进过代码审查的那一份。
          cp test/TestHookDll/TestHookDll-x64.dll             dist/
          cp test/TestHookDll/TestHookDll-x86.dll             dist/
          cp test/TestReflectiveDll/TestReflectiveDll-x64.dll dist/
          cp test/TestReflectiveDll/TestReflectiveDll-x86.dll dist/
          # TextHookDll 是本地构建产物（不入库），只能从 native job 的 artifact 取。
          cp artifacts/native-test-output/TextHookDll-x64.dll      dist/
          cp artifacts/native-test-output/TextHookDll-x86.dll      dist/
          cp artifacts/native-test-output/TextHookClient.exe       dist/
          cp test/TextHookDll/TextHookDll.profiles.ini             dist/
          ls -la dist

      - name: Prepare release notes
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version: $VERSION"

          {
            echo "## DLL 注入器 ${GITHUB_REF_NAME}"
            echo
            echo "Windows DLL 注入器，图形界面 + 命令行双模式，自包含单文件，**无需安装 .NET 运行时**。"
            echo
            echo "### 下载哪个"
            echo
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`DllInjector-x64.exe\` | 64 位版本，用于注入 64 位目标程序 |"
            echo "| \`DllInjector-x86.exe\` | 32 位版本，用于注入 32 位目标程序 |"
            echo
            echo "要注入的程序是多少位，就用多少位的注入器；位数不符会被拦截并提示。"
            echo "其余附件是测试样例 DLL 与文本 Hook 的引擎适配表模板，普通注入不需要它们。"
            echo
            echo "### 本版变更"
            echo
          } > dist/RELEASE_BODY.md

          # 从 CHANGELOG 抽取本版段落，正文与仓库记录保持同一份来源。
          # 用 awk 而不是 python：release job 跑在 ubuntu-latest 上两者都有，
          # 但这段只做「按标题切段」，awk 足以胜任，且不依赖解释器版本。
          # 找不到段落时直接失败——宁可中断发版，也不要发出一份没有说明的 Release。
          awk -v want="[${VERSION}]" '
            /^## \[/ {
              if (inside) exit
              n = split($0, a, " ")
              if (n >= 2 && a[2] == want) { inside = 1; next }
            }
            inside
          ' CHANGELOG.md > dist/section.md

          if [ ! -s dist/section.md ]; then
            echo "no '## [${VERSION}]' section in CHANGELOG.md"
            exit 1
          fi
          cat dist/section.md >> dist/RELEASE_BODY.md

          {
            echo
            echo "### 已知限制"
            echo
            echo "- **启动后有一小段抓不到**：挂钩发生在目标程序开始运行之后，启动后约百毫秒内的文本会漏掉。"
            echo "- **DirectX / OpenGL 自绘引擎不覆盖**：文本不进 GDI，IAT Hook 无从下手。"
            echo "- **不做句子重组**：逐字/逐次输出交给消费端自行合并。"
            echo
            echo "完整历史见 [CHANGELOG](https://github.com/isTurn/DllInjectorTest/blob/main/CHANGELOG.md)，"
            echo "使用说明与构建方式见 [README](https://github.com/isTurn/DllInjectorTest#readme)。"
            echo
            echo "> 本工具仅供学习研究与软件互操作性测试，请勿用于侵犯他人权益的场景。"
          } >> dist/RELEASE_BODY.md

          echo "---- release body ----"
          cat dist/RELEASE_BODY.md

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dll
            dist/*.ini
          # 固定结构 + 从 CHANGELOG 抽取的本版段落，避免两处各写一份、日久脱节。
          # softprops 的 generate_release_notes 会重复追加 "Full Changelog"，故不用。
          body_path: dist/RELEASE_BODY.md
